# Runs the browser tests (tests/) on every pull request and on main: the board, styles, sound,
# the phone remote and Friends, against a local copy of the site and a local stand-in for ntfy.sh.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the css/ and js/ version stamps in index.html
        run: python3 scripts/stamp.py --check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
